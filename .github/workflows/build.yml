name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the app (.NET Framework 4.8)
        run: dotnet build src/App/CodeplugBuilder.csproj -c Release

      # The user's CPS export isn't in the repo, so the tests that need it report SKIP.
      - name: Run the engine tests
        run: dotnet run --project tests -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: CodeplugBuilder
          path: |
            src/App/bin/Release/net48/CodeplugBuilder.exe
            src/App/bin/Release/net48/CodeplugBuilder.exe.config
